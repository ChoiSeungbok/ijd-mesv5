String APK_NAME = "MESPDAClient"

String PACKAGE_NAME = "com.pda.mes"

String VERSION_NAME = "1.0.11"

int VERSION_CODE = 31

String ALIAS = "mespda"

String KEY_PASSWORD = "mespda11"

apply plugin: 'com.android.application'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}

android {
    compileSdkVersion 26
    buildToolsVersion '28.0.3'
    flavorDimensions "default"

    defaultConfig {
        applicationId PACKAGE_NAME
        minSdkVersion 25
        targetSdkVersion 26
        multiDexEnabled true
    }

    aaptOptions {
        cruncherEnabled = false
    }

    productFlavors {
        develop {
            versionCode VERSION_CODE
            versionName VERSION_NAME
        }

        production {
            versionCode VERSION_CODE
            versionName VERSION_NAME
        }
    }

    signingConfigs {

        develop {
            storeFile file("../key/MESPDA.keystore")
            storePassword KEY_PASSWORD
            keyAlias ALIAS
            keyPassword KEY_PASSWORD
        }

        production {
            storeFile file("../key/MESPDA.keystore")
            storePassword KEY_PASSWORD
            keyAlias ALIAS
            keyPassword KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.develop
//            versionNameSuffix "-DEBUG"
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.production
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = APK_NAME + "_v" + variant.versionName + ".apk"
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }
}

dependencies {
    implementation files('libs/transceiverx-j-7.0.10.jar')
    implementation files('libs/M3SDK.jar')
    implementation files('libs/device.sdk.jar')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.2'
    implementation 'com.android.support:design:26.1.0'

    implementation('com.stanfy:gson-xml-java:0.1.+') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'de.greenrobot:eventbus:2.2.1'
    implementation 'com.kyleduo.switchbutton:library:2.0.0'
}
